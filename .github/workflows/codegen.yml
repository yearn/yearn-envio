name: codegen

on:
  pull_request:

jobs:
  codegen:
    runs-on: ubuntu-latest
    env:
      ENVIO_RPC_URL_HYPEREVM: http://codegen.invalid
      ENVIO_RPC_URL_ROBINHOOD: http://codegen.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
