name: Validate Envio config

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/validate-envio-config.yml"
      - "config.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "schema.graphql"
      - "scripts/check_envio_config_compatibility.mjs"
      - "src/**"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: validate-envio-config-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse, compare, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate

      - name: Install dependencies
        # pnpm-workspace.yaml explicitly permits lifecycle scripts only for
        # esbuild and rescript. Keep pnpm's strict dependency-build checks on.
        run: pnpm install --frozen-lockfile

      - name: Validate Envio compatibility with base branch
        run: >-
          node scripts/check_envio_config_compatibility.mjs
          --base-ref "origin/${{ github.base_ref }}"

      - name: Generate Envio code
        run: pnpm codegen

      - name: Type-check indexer
        run: pnpm build
