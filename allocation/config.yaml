# yaml-language-server: $schema=../node_modules/envio/evm.schema.json
name: yearn-vault-allocation-ethereum
description: Isolated Yearn V3 allocation history producer
schema: schema.graphql
storage:
  postgres: true
field_selection:
  transaction_fields:
    - hash
    - from
    - to
    - input
    - transactionIndex
contracts:
  - name: YearnV3Registry
    handler: src/EventHandlers.ts
    events:
      - event: "NewEndorsedVault(address indexed vault, address indexed asset, uint256 releaseVersion, uint256 vaultType)"
  - name: YearnV3VaultFactory
    handler: src/EventHandlers.ts
    events:
      - event: "NewVault(address indexed vault_address, address indexed asset)"
  - name: YearnV3RoleManagerFactory
    handler: src/EventHandlers.ts
    events:
      - event: "NewProject(bytes32 indexed projectId, address indexed roleManager)"
  - name: YearnV3Vault
    handler: src/EventHandlers.ts
    events:
      - event: "Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)"
      - event: "Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets, uint256 shares)"
      - event: "DebtUpdated(address indexed strategy, uint256 currentDebt, uint256 newDebt)"
      - event: "StrategyReported(address indexed strategy, uint256 gain, uint256 loss, uint256 currentDebt, uint256 protocolFees, uint256 totalFees, uint256 totalRefunds)"
      - event: "StrategyChanged(address indexed strategy, uint256 indexed changeType)"
      - event: "UpdatedMaxDebtForStrategy(address indexed sender, address indexed strategy, uint256 newDebt)"
      - event: "DebtPurchased(address indexed strategy, uint256 amount)"
      - event: "UpdateDefaultQueue(address[] newDefaultQueue)"
      - event: "UpdateUseDefaultQueue(bool useDefaultQueue)"
      - event: "UpdateMinimumTotalIdle(uint256 minimumTotalIdle)"
      - event: "UpdateAutoAllocate(bool autoAllocate)"
      - event: "Shutdown()"
      - event: "RoleSet(address indexed account, uint256 indexed role)"
      - event: "RoleStatusChanged(uint256 indexed role, uint256 indexed status)"
      - event: "UpdateRoleManager(address indexed roleManager)"
      - event: "UpdateAccountant(address indexed accountant)"
  - name: YearnV3RoleManager
    handler: src/EventHandlers.ts
    events:
      - event: "AddedNewVault(address indexed vault, address indexed debtAllocator, uint256 category)"
      - event: "RemovedVault(address indexed vault)"
      - event: "UpdateDebtAllocator(address indexed vault, address indexed debtAllocator)"
  - name: DebtAllocatorFactory
    handler: src/EventHandlers.ts
    events:
      - event: "NewDebtAllocator(address indexed allocator, address indexed vault)"
  - name: DebtAllocator
    handler: src/EventHandlers.ts
    events:
      - event: "UpdateStrategyDebtRatios(address indexed strategy, uint256 newTargetRatio, uint256 newMaxRatio, uint256 newTotalDebtRatio)"
      - event: "UpdateKeeper(address indexed keeper, bool allowed)"
      - event: "GovernanceTransferred(address indexed previousGovernance, address indexed newGovernance)"
chains:
  - id: 1
    start_block: 0
    contracts:
      - name: YearnV3Registry
        address:
          - "0x0377b4daDDA86C89A0091772B79ba67d0E5F7198"
          - "0xff31A1B020c868F6eA3f61Eb953344920EeCA3af"
          - "0xd40ecF29e001c76Dcc4cC0D9cd50520CE845B038"
      - name: YearnV3VaultFactory
        address:
          - "0xE9E8C89c8Fc7E8b8F23425688eb68987231178e5"
          - "0x444045c5C13C246e117eD36437303cac8E250aB0"
          - "0x5577EdcB8A856582297CdBbB07055E6a6E38eb5f"
          - "0x770D0d1Fb036483Ed4AbB6d53c1C88fb277D812F"
      - name: YearnV3RoleManagerFactory
        address:
          - "0xca12459a931643BF28388c67639b3F352fe9e5Ce"
      - name: YearnV3RoleManager
        address:
          - "0xb3bd6B2E61753C311EFbCF0111f75D29706D9a41"
      - name: YearnV3Vault
        address: []
      - name: DebtAllocatorFactory
        address:
          - "0xfCF8c7C43dedd567083B422d6770F23B78D15BDe"
      - name: DebtAllocator
        address: []
