services:
  - type: web
    name: envio-monitoring
    runtime: node
    envVars:
      - key: NODE_VERSION
        value: "22.23.5"
    rootDir: ./monitoring
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz

  - type: web
    name: graphiql
    runtime: node
    region: virginia
    plan: starter
    rootDir: ./graphiql
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    domains:
      - envio-explorer.yearn.dev
    envVars:
      - key: NODE_VERSION
        value: "22.23.5"
      - key: PORT
        value: "4000"
      - key: HASURA_ENDPOINT
        value: https://indexer.hyperindex.xyz/5a089e4/v1/graphql
